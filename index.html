<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>借贷查询管理系统</title>
    <style>
        :root {
            --primary: #4f6ef7;
            --primary-dark: #3b54d4;
            --success: #22c55e;
            --success-light: #dcfce7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --info: #3b82f6;
            --info-light: #dbeafe;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --border-focus: #4f6ef7;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1), 0 4px 10px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            padding: 0 24px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
        }
        .header-inner {
            max-width: 1100px; margin: 0 auto; display: flex; align-items: center;
            justify-content: space-between; height: 60px; gap: 16px; flex-wrap: wrap;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.25rem; color: var(--primary); }
        .logo-icon {
            width: 38px; height: 38px; background: linear-gradient(135deg, #4f6ef7, #7b8ff7);
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: #fff;
        }
        .nav-tabs { display: flex; gap: 4px; background: #f1f5f9; border-radius: 10px; padding: 4px; }
        .nav-tab {
            padding: 8px 18px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.9rem;
            transition: var(--transition); border: none; background: transparent; color: var(--text-secondary);
            white-space: nowrap; font-family: inherit;
        }
        .nav-tab:hover { color: var(--text); background: #e8ecf3; }
        .nav-tab.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); font-weight: 600; }
        .nav-badge {
            display: inline-block; background: var(--danger); color: #fff; font-size: 0.7rem;
            padding: 2px 7px; border-radius: 10px; margin-left: 4px; font-weight: 600;
            animation: pulse-badge 2s infinite;
        }
        @keyframes pulse-badge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        .btn {
            padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600;
            font-size: 0.9rem; transition: var(--transition); font-family: inherit; display: inline-flex;
            align-items: center; gap: 6px; white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,110,247,0.35); }
        .btn-outline { background: #fff; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: #eef1ff; transform: translateY(-1px); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #16a34a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,0.3); }
        .btn-danger { background: #fff; color: var(--danger); border: 2px solid var(--danger); }
        .btn-danger:hover { background: #fef2f2; transform: translateY(-1px); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; border-radius: 6px; }
        .btn-xs { padding: 4px 10px; font-size: 0.75rem; border-radius: 5px; }

        .main-container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; }
        .view { display: none; animation: fadeSlideIn 0.35s ease; }
        .view.active { display: block; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card-bg); border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
            box-shadow: var(--shadow); border: 1px solid var(--border); transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
            flex-wrap: wrap; gap: 12px;
        }
        .card-title { font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
        .card-title .icon {
            width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center;
            justify-content: center; font-size: 1rem;
        }
        .icon-blue { background: #eef2ff; color: #4f6ef7; }
        .icon-green { background: #dcfce7; color: #22c55e; }
        .icon-orange { background: #fef3c7; color: #f59e0b; }
        .icon-red { background: #fee2e2; color: #ef4444; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--text); }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            font-size: 0.95rem; transition: var(--transition); background: #fafbfc; font-family: inherit; color: var(--text);
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none; border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(79,110,247,0.1); background: #fff;
        }
        .form-textarea { resize: vertical; min-height: 80px; }
        .form-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 180px; }
        .form-hint { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

        .result-summary { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .summary-card {
            flex: 1; min-width: 160px; padding: 20px; border-radius: var(--radius); text-align: center;
            border: 2px solid var(--border); background: #fafbfc; transition: var(--transition);
        }
        .summary-card.net-positive { border-color: #fca5a5; background: #fff5f5; }
        .summary-card.net-negative { border-color: #86efac; background: #f0fdf4; }
        .summary-card.net-zero { border-color: #c4b5fd; background: #faf9ff; }
        .summary-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 4px; }
        .summary-amount { font-size: 1.6rem; font-weight: 800; }
        .summary-amount.positive { color: #dc2626; }
        .summary-amount.negative { color: #16a34a; }
        .net-badge {
            display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 700;
            font-size: 0.85rem; margin-top: 6px;
        }
        .net-badge.owe-me { background: #fee2e2; color: #dc2626; }
        .net-badge.i-owe { background: #dcfce7; color: #16a34a; }
        .net-badge.balanced { background: #ede9fe; color: #7c3aed; }

        .table-wrapper { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 700px; }
        thead { background: #f8fafc; }
        th {
            padding: 12px 14px; text-align: left; font-weight: 600; color: var(--text-secondary);
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
            border-bottom: 2px solid var(--border); white-space: nowrap;
        }
        td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tbody tr:hover { background: #f8fafc; }
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-approved { background: #dcfce7; color: #16a34a; }
        .badge-pending { background: #fef3c7; color: #d97706; animation: pulse-badge 2s infinite; }
        .badge-rejected { background: #fee2e2; color: #dc2626; }
        .badge-direction-owe-me { background: #fee2e2; color: #b91c1c; }
        .badge-direction-i-owe { background: #dcfce7; color: #15803d; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }

        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            padding: 14px 20px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2); animation: slideInRight 0.3s ease, fadeOutRight 0.3s ease forwards;
            pointer-events: auto; max-width: 400px; display: flex; align-items: center; gap: 8px;
        }
        .toast-success { background: #22c55e; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOutRight { 0%,70% { opacity:1; transform:translateX(0); } 100% { opacity:0; transform:translateX(80%); } }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .modal {
            background: #fff; border-radius: var(--radius); padding: 28px; max-width: 500px;
            width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }
        .modal h3 { margin-bottom: 16px; font-size: 1.2rem; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }

        .login-container { max-width: 420px; margin: 60px auto; }
        .login-card {
            background: var(--card-bg); border-radius: var(--radius); padding: 36px 28px;
            box-shadow: var(--shadow-lg); border: 1px solid var(--border); text-align: center;
        }
        .login-card .lock-icon { font-size: 3rem; margin-bottom: 12px; }
        .login-card h2 { margin-bottom: 8px; }
        .login-card .subtitle { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .header-inner { height: auto; padding: 12px 0; gap: 8px; }
            .nav-tab { padding: 6px 12px; font-size: 0.8rem; }
            .btn { padding: 8px 14px; font-size: 0.8rem; }
            .form-row { flex-direction: column; gap: 0; }
            .result-summary { flex-direction: column; }
            .card { padding: 16px; }
            .main-container { padding: 16px 12px 30px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo"><div class="logo-icon">💰</div><span>借贷查询系统</span></div>
            <div class="nav-tabs" id="navTabs">
                <button class="nav-tab active" data-view="publicView" onclick="switchView('publicView')">🔍 查询借贷</button>
                <button class="nav-tab" data-view="applyView" onclick="switchView('applyView')">📝 提交申请</button>
                <button class="nav-tab" data-view="adminView" onclick="switchView('adminView')" id="adminNavTab">
                    ⚙️ 后台管理 <span class="nav-badge" id="pendingBadge" style="display:none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="view active" id="publicView">
            <div class="card">
                <div class="card-header"><div class="card-title"><span class="icon icon-blue">🔍</span> 查询欠款情况</div></div>
                <p style="color:var(--text-secondary);margin-bottom:16px;font-size:0.9rem;">输入您的姓名，查看您与管理方之间的借贷记录。</p>
                <div class="form-row">
                    <div class="form-group" style="flex:2;min-width:200px;">
                        <label class="form-label" for="queryName">📛 您的姓名</label>
                        <input type="text" class="form-input" id="queryName" placeholder="请输入姓名进行查询..." onkeydown="if(event.key==='Enter')performQuery();">
                    </div>
                    <div class="form-group" style="flex:0;min-width:auto;display:flex;align-items:flex-end;">
                        <button class="btn btn-primary" onclick="performQuery()" style="height:44px;">🔎 立即查询</button>
                    </div>
                </div>
                <div class="form-hint">💡 查询仅显示已审核确认的记录，待审核的申请不会出现在此。</div>
            </div>
            <div id="queryResultArea" style="display:none;">
                <div class="result-summary" id="resultSummary"></div>
                <div class="card" id="resultDetailCard">
                    <div class="card-header"><div class="card-title"><span class="icon icon-blue">📋</span> 详细记录</div><span id="resultCount"></span></div>
                    <div class="table-wrapper"><table><thead><tr><th>日期</th><th>方向</th><th>金额 (元)</th><th>说明</th><th>状态</th></tr></thead><tbody id="resultTableBody"></tbody></table></div>
                    <div class="empty-state" id="resultEmpty" style="display:none;"><div class="empty-icon">📭</div><p>未找到与该姓名相关的已确认记录</p></div>
                </div>
            </div>
        </div>

        <div class="view" id="applyView">
            <div class="card">
                <div class="card-header"><div class="card-title"><span class="icon icon-orange">📝</span> 提交欠款申请</div></div>
                <p style="color:var(--text-secondary);margin-bottom:16px;font-size:0.9rem;">请如实填写以下信息，提交后需经管理员审核。</p>
                <form id="applyForm" onsubmit="submitApplication(event)">
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">📛 您的姓名 <span style="color:#ef4444;">*</span></label><input type="text" class="form-input" id="applyName" required></div>
                        <div class="form-group"><label class="form-label">💵 金额（元）<span style="color:#ef4444;">*</span></label><input type="number" class="form-input" id="applyAmount" min="0.01" step="0.01" required></div>
                    </div>
                    <div class="form-group"><label class="form-label">🔄 欠款方向 <span style="color:#ef4444;">*</span></label><select class="form-select" id="applyDirection" required><option value="">-- 请选择 --</option><option value="they_owe_me">我欠管理员钱</option><option value="i_owe_them">管理员欠我钱</option></select></div>
                    <div class="form-group"><label class="form-label">📄 说明备注</label><textarea class="form-textarea" id="applyDesc"></textarea></div>
                    <div class="form-group"><label class="form-label">📅 借款日期</label><input type="date" class="form-input" id="applyDate"></div>
                    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:13px;">📤 提交申请，等待审核</button>
                </form>
            </div>
        </div>

        <div class="view" id="adminView">
            <div id="adminLoginSection" class="login-container">
                <div class="login-card"><div class="lock-icon">🔒</div><h2>后台管理登录</h2><p class="subtitle">请输入管理密码</p>
                    <form onsubmit="adminLogin(event)"><input type="password" class="form-input" id="adminPasswordInput" required><button type="submit" class="btn btn-primary" style="width:100%;">🔑 登录</button></form>
                </div>
            </div>
            <div id="adminPanelSection" style="display:none;">
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;">
                    <button class="btn btn-sm btn-primary admin-sub-tab" data-panel="allRecords" onclick="switchAdminPanel('allRecords')">📋 所有记录</button>
                    <button class="btn btn-sm btn-outline admin-sub-tab" data-panel="pendingReview" onclick="switchAdminPanel('pendingReview')" id="pendingReviewBtn">⏳ 待审核 <span id="pendingCountBadge" style="background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;">0</span></button>
                    <button class="btn btn-sm btn-outline admin-sub-tab" data-panel="addRecord" onclick="switchAdminPanel('addRecord')">➕ 手动添加</button>
                    <button class="btn btn-sm btn-outline admin-sub-tab" data-panel="settings" onclick="switchAdminPanel('settings')">⚙️ 设置</button>
                    <button class="btn btn-sm btn-danger" style="margin-left:auto;" onclick="adminLogout()">🚪 退出</button>
                </div>
                <div class="admin-panel" id="panel-allRecords">
                    <div class="card">
                        <div class="card-header"><div class="card-title"><span class="icon icon-blue">📋</span> 全部借贷记录</div>
                            <div style="display:flex;gap:8px;"><input type="text" class="form-input" id="recordSearch" placeholder="🔍 搜索姓名..." style="width:180px;" oninput="renderAllRecords()"><select class="form-select" id="recordFilter" style="width:130px;" onchange="renderAllRecords()"><option value="all">全部</option><option value="approved">已批准</option><option value="pending">待审核</option><option value="rejected">已拒绝</option></select></div>
                        </div>
                        <div class="table-wrapper"><table><thead><tr><th>ID</th><th>姓名</th><th>方向</th><th>金额</th><th>说明</th><th>日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="allRecordsTableBody"></tbody></table></div>
                        <div class="empty-state" id="allRecordsEmpty" style="display:none;"><div class="empty-icon">📭</div><p>暂无匹配记录</p></div>
                    </div>
                </div>
                <div class="admin-panel" id="panel-pendingReview" style="display:none;">
                    <div class="card"><div class="card-header"><div class="card-title"><span class="icon icon-orange">⏳</span> 待审核申请</div></div>
                        <div class="table-wrapper"><table><thead><tr><th>ID</th><th>姓名</th><th>方向</th><th>金额</th><th>说明</th><th>日期</th><th>操作</th></tr></thead><tbody id="pendingTableBody"></tbody></table></div>
                        <div class="empty-state" id="pendingEmpty" style="display:none;"><div class="empty-icon">✅</div><p>没有待审核的申请</p></div>
                    </div>
                </div>
                <div class="admin-panel" id="panel-addRecord" style="display:none;">
                    <div class="card"><div class="card-header"><div class="card-title"><span class="icon icon-green">➕</span> 手动添加记录</div></div>
                        <form id="manualAddForm" onsubmit="manualAddRecord(event)">
                            <div class="form-row"><div class="form-group"><label>📛 对方姓名</label><input type="text" class="form-input" id="manualName" required></div><div class="form-group"><label>💵 金额</label><input type="number" class="form-input" id="manualAmount" min="0.01" step="0.01" required></div></div>
                            <div class="form-group"><label>🔄 方向</label><select class="form-select" id="manualDirection" required><option value="">-- 请选择 --</option><option value="they_owe_me">对方欠我</option><option value="i_owe_them">我欠对方</option></select></div>
                            <div class="form-row"><div class="form-group"><label>📄 说明</label><textarea class="form-textarea" id="manualDesc"></textarea></div><div class="form-group"><label>📅 日期</label><input type="date" class="form-input" id="manualDate"></div></div>
                            <button type="submit" class="btn btn-success" style="width:100%;">✅ 直接添加（已确认生效）</button>
                        </form>
                    </div>
                </div>
                <div class="admin-panel" id="panel-settings" style="display:none;">
                    <div class="card"><div class="card-header"><div class="card-title"><span class="icon icon-blue">⚙️</span> 设置</div></div>
                        <form onsubmit="changePassword(event)"><div class="form-group"><label>🔑 新密码</label><input type="password" class="form-input" id="newPassword" minlength="4" required></div><button type="submit" class="btn btn-primary">💾 保存</button></form>
                        <hr><div>📊 数据统计：<span id="statsInfo">加载中...</span></div>
                        <button class="btn btn-danger btn-sm" style="margin-top:12px;" onclick="resetAllData()">🗑️ 清空全部数据</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal" style="display:none;">
        <div class="modal"><h3>✏️ 编辑记录</h3>
            <form id="editForm" onsubmit="saveEdit(event)"><input type="hidden" id="editId">
                <div class="form-row"><div class="form-group"><label>姓名</label><input class="form-input" id="editName" required></div><div class="form-group"><label>金额</label><input type="number" class="form-input" id="editAmount" step="0.01" required></div></div>
                <div class="form-group"><label>方向</label><select class="form-select" id="editDirection"><option value="they_owe_me">对方欠我</option><option value="i_owe_them">我欠对方</option></select></div>
                <div class="form-row"><div class="form-group"><label>说明</label><textarea class="form-textarea" id="editDesc"></textarea></div><div class="form-group"><label>日期</label><input type="date" class="form-input" id="editDate"></div></div>
                <div class="form-group"><label>状态</label><select class="form-select" id="editStatus"><option value="approved">已批准</option><option value="pending">待审核</option><option value="rejected">已拒绝</option></select></div>
                <div class="modal-actions"><button type="button" class="btn btn-outline btn-sm" onclick="closeEditModal()">取消</button><button type="submit" class="btn btn-primary btn-sm">💾 保存</button></div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== 配置：把下面的 ID 换成你自己的 jsonblob ID ====================
        const JSONBLOB_ID = '019dc904-d6ff-7a63-8830-02800b320fef';  // ← 替换这里

        const API_URL = `https://jsonblob.com/api/jsonBlob/019dc904-d6ff-7a63-8830-02800b320fef`;

        // ==================== 全局状态 ====================
        let cachedRecords = [];
        let pollTimer = null;

        // ==================== 工具函数 ====================
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
        function generateId() {
            return 'REC-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        }
        function getTodayDate() { return new Date().toISOString().split('T')[0]; }
        function formatDate(d) { if(!d) return '—'; const dt = new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
        function formatAmount(a) { return '¥ ' + parseFloat(a).toFixed(2); }
        function showToast(msg, type='info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast toast-'+type;
            const icons = {success:'✅', error:'❌', info:'ℹ️'};
            toast.textContent = (icons[type]||'') + ' ' + msg;
            toast.style.animationDuration = '0.3s, 0.3s';
            toast.style.animationDelay = '0s, 2.5s';
            container.appendChild(toast);
            setTimeout(() => { if(toast.parentNode) toast.remove(); }, 3000);
        }

        // ==================== 数据读写（jsonblob） ====================
        async function fetchRecords() {
            try {
                const res = await fetch(API_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('读取失败');
                const data = await res.json();
                cachedRecords = Array.isArray(data) ? data : [];
                updatePendingBadge();
            } catch(e) {
                console.error(e);
                showToast('数据加载失败', 'error');
            }
        }

        async function saveAllRecords() {
            try {
                const res = await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cachedRecords)
                });
                if (!res.ok) throw new Error('保存失败');
                return true;
            } catch(e) {
                console.error(e);
                showToast('保存失败，请稍后重试', 'error');
                return false;
            }
        }

        function startPolling() {
            if(pollTimer) clearInterval(pollTimer);
            fetchRecords();
            pollTimer = setInterval(fetchRecords, 5000);
        }

        // ==================== 数据操作 ====================
        async function addRecord(r) { cachedRecords.push(r); if(!await saveAllRecords()) cachedRecords.pop(); }
        async function updateRecord(id, updates) {
            const idx = cachedRecords.findIndex(r => r.id===id);
            if(idx===-1) return;
            const orig = {...cachedRecords[idx]};
            Object.assign(cachedRecords[idx], updates);
            if(!await saveAllRecords()) cachedRecords[idx] = orig;
        }
        async function deleteRecordById(id) {
            const idx = cachedRecords.findIndex(r => r.id===id);
            if(idx===-1) return;
            const del = cachedRecords.splice(idx,1)[0];
            if(!await saveAllRecords()) cachedRecords.splice(idx,0,del);
        }

        // ==================== 登录 ====================
        const DEF_PWD = 'syqdsg';
        function getPwd() { return localStorage.getItem('adminPassword') || DEF_PWD; }
        function adminLogin(e) {
            e.preventDefault();
            if(document.getElementById('adminPasswordInput').value === getPwd()) {
                sessionStorage.setItem('isAdminLoggedIn','true');
                document.getElementById('adminLoginSection').style.display='none';
                document.getElementById('adminPanelSection').style.display='block';
                switchAdminPanel('allRecords');
                showToast('登录成功','success');
            } else showToast('密码错误','error');
        }
        function adminLogout() {
            sessionStorage.removeItem('isAdminLoggedIn');
            document.getElementById('adminLoginSection').style.display='block';
            document.getElementById('adminPanelSection').style.display='none';
        }
        function checkAdminLogin() {
            const is = sessionStorage.getItem('isAdminLoggedIn')==='true';
            document.getElementById('adminLoginSection').style.display = is ? 'none' : 'block';
            document.getElementById('adminPanelSection').style.display = is ? 'block' : 'none';
        }

        // ==================== 视图切换 ====================
        function switchView(name) {
            document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            const idx = {publicView:0,applyView:1,adminView:2}[name];
            const tabs = document.querySelectorAll('.nav-tab');
            if(tabs[idx]) tabs[idx].classList.add('active');
            if(name==='adminView') { checkAdminLogin(); updatePendingBadge(); }
        }
        function switchAdminPanel(panel) {
            document.querySelectorAll('.admin-panel').forEach(p=>p.style.display='none');
            document.querySelectorAll('.admin-sub-tab').forEach(b=>{b.classList.remove('btn-primary');b.classList.add('btn-outline');});
            const panelEl = document.getElementById('panel-'+panel);
            if(panelEl) panelEl.style.display='block';
            const btn = document.querySelector(`.admin-sub-tab[data-panel="${panel}"]`);
            if(btn) { btn.classList.remove('btn-outline'); btn.classList.add('btn-primary'); }
            if(panel==='allRecords') renderAllRecords();
            if(panel==='pendingReview') renderPendingRecords();
            if(panel==='settings') updateStats();
            if(panel==='addRecord') document.getElementById('manualDate').value = getTodayDate();
        }

        function updatePendingBadge() {
            const count = cachedRecords.filter(r=>r.status==='pending').length;
            document.getElementById('pendingBadge').style.display = count ? 'inline-block' : 'none';
            document.getElementById('pendingBadge').textContent = count;
            document.getElementById('pendingCountBadge').textContent = count;
        }

        // ==================== 查询 ====================
        function performQuery() {
            const name = document.getElementById('queryName').value.trim();
            if(!name) return showToast('请输入姓名','error');
            const matched = cachedRecords.filter(r=> r.name.trim()===name && r.status==='approved');
            const area = document.getElementById('queryResultArea'); area.style.display='block';
            if(matched.length===0) {
                document.getElementById('resultSummary').innerHTML='';
                document.getElementById('resultTableBody').innerHTML='';
                document.getElementById('resultEmpty').style.display='block';
                document.getElementById('resultCount').textContent='0 条记录';
                document.querySelector('#resultDetailCard .table-wrapper').style.display='none';
            } else {
                document.getElementById('resultEmpty').style.display='none';
                document.querySelector('#resultDetailCard .table-wrapper').style.display='block';
                document.getElementById('resultCount').textContent = matched.length + ' 条记录';
                let oweMe=0, iOwe=0;
                matched.forEach(r=>{ if(r.direction==='they_owe_me') oweMe+=r.amount; else iOwe+=r.amount; });
                const net = oweMe - iOwe;
                let cls='net-zero', lbl='平衡', badge='balanced';
                if(net>0.005) { cls='net-positive'; lbl='对方净欠您'; badge='owe-me'; }
                else if(net<-0.005) { cls='net-negative'; lbl='您净欠对方'; badge='i-owe'; }
                document.getElementById('resultSummary').innerHTML = `
                    <div class="summary-card" style="border-color:#fca5a5;background:#fff5f5;"><div class="summary-label">📌 对方欠您</div><div class="summary-amount positive">${formatAmount(oweMe)}</div></div>
                    <div class="summary-card" style="border-color:#86efac;background:#f0fdf4;"><div class="summary-label">📌 您欠对方</div><div class="summary-amount negative">${formatAmount(iOwe)}</div></div>
                    <div class="summary-card ${cls}"><div class="summary-label">⚖️ 净额</div><div class="summary-amount" style="color:${net>0?'#dc2626':net<0?'#16a34a':'#7c3aed'}">${net>=0?'':'-'}${formatAmount(Math.abs(net))}</div><span class="net-badge ${badge}">${lbl}</span></div>`;
                document.getElementById('resultTableBody').innerHTML = matched.map(r=>`
                    <tr><td>${formatDate(r.date)}</td><td>${r.direction==='they_owe_me'?'<span class="badge badge-direction-owe-me">对方欠我</span>':'<span class="badge badge-direction-i-owe">我欠对方</span>'}</td><td><strong>${formatAmount(r.amount)}</strong></td><td>${escapeHTML(r.description||'—')}</td><td><span class="badge badge-approved">✅ 已确认</span></td></tr>`).join('');
            }
            area.scrollIntoView({behavior:'smooth'});
        }

        // ==================== 提交申请 ====================
        async function submitApplication(e) {
            e.preventDefault();
            const rec = {
                id: generateId(),
                name: document.getElementById('applyName').value.trim(),
                amount: parseFloat(document.getElementById('applyAmount').value),
                direction: document.getElementById('applyDirection').value,
                description: document.getElementById('applyDesc').value.trim(),
                date: document.getElementById('applyDate').value || getTodayDate(),
                status: 'pending',
                createdAt: new Date().toISOString()
            };
            if(!rec.name || isNaN(rec.amount) || rec.amount<=0 || !rec.direction) return showToast('请填写完整','error');
            await addRecord(rec);
            document.getElementById('applyForm').reset();
            document.getElementById('applyDate').value = '';
            showToast('申请已提交','success');
        }

        // ==================== 后台渲染 ====================
        function renderAllRecords() {
            const search = document.getElementById('recordSearch')?.value?.trim()?.toLowerCase() || '';
            const filter = document.getElementById('recordFilter')?.value || 'all';
            let list = cachedRecords;
            if(search) list = list.filter(r=> r.name.toLowerCase().includes(search));
            if(filter!=='all') list = list.filter(r=> r.status===filter);
            const tbody = document.getElementById('allRecordsTableBody');
            const empty = document.getElementById('allRecordsEmpty');
            const wrap = tbody.closest('.table-wrapper');
            if(list.length===0) { tbody.innerHTML=''; empty.style.display='block'; wrap.style.display='none'; }
            else {
                empty.style.display='none'; wrap.style.display='block';
                tbody.innerHTML = list.map(r=>{
                    const dir = r.direction==='they_owe_me'?'<span class="badge badge-direction-owe-me">对方欠我</span>':'<span class="badge badge-direction-i-owe">我欠对方</span>';
                    const stat = {approved:'<span class="badge badge-approved">✅ 已批准</span>',pending:'<span class="badge badge-pending">⏳ 待审核</span>',rejected:'<span class="badge badge-rejected">❌ 已拒绝</span>'}[r.status];
                    return `<tr><td style="font-size:0.75rem;">${r.id}</td><td><strong>${escapeHTML(r.name)}</strong></td><td>${dir}</td><td><strong>${formatAmount(r.amount)}</strong></td><td>${escapeHTML(r.description||'—')}</td><td>${formatDate(r.date)}</td><td>${stat}</td><td><button class="btn btn-xs btn-outline" onclick="editRecord('${r.id}')">✏️</button> <button class="btn btn-xs btn-danger" onclick="deleteRecord('${r.id}')">🗑️</button>${r.status==='pending'?` <button class="btn btn-xs btn-success" onclick="approveRecord('${r.id}')">✅</button> <button class="btn btn-xs btn-danger" onclick="rejectRecord('${r.id}')">❌</button>`:''}</td></tr>`;
                }).join('');
            }
        }
        function renderPendingRecords() {
            const pending = cachedRecords.filter(r=> r.status==='pending');
            const tbody = document.getElementById('pendingTableBody');
            const empty = document.getElementById('pendingEmpty');
            const wrap = tbody.closest('.table-wrapper');
            if(pending.length===0) { tbody.innerHTML=''; empty.style.display='block'; wrap.style.display='none'; }
            else {
                empty.style.display='none'; wrap.style.display='block';
                tbody.innerHTML = pending.map(r=>{
                    const dir = r.direction==='they_owe_me'?'<span class="badge badge-direction-owe-me">对方欠我</span>':'<span class="badge badge-direction-i-owe">我欠对方</span>';
                    return `<tr><td>${r.id}</td><td><strong>${escapeHTML(r.name)}</strong></td><td>${dir}</td><td><strong>${formatAmount(r.amount)}</strong></td><td>${escapeHTML(r.description||'—')}</td><td>${formatDate(r.date)}</td><td><button class="btn btn-xs btn-success" onclick="approveRecord('${r.id}')">✅</button> <button class="btn btn-xs btn-danger" onclick="rejectRecord('${r.id}')">❌</button> <button class="btn btn-xs btn-outline" onclick="editRecord('${r.id}')">✏️</button></td></tr>`;
                }).join('');
            }
            updatePendingBadge();
        }

        async function approveRecord(id) { await updateRecord(id, {status:'approved'}); showToast('已批准','success'); }
        async function rejectRecord(id) { await updateRecord(id, {status:'rejected'}); showToast('已拒绝','info'); }
        async function deleteRecord(id) { if(confirm('确定删除？')) { await deleteRecordById(id); showToast('已删除','info'); } }

        function editRecord(id) {
            const r = cachedRecords.find(r=>r.id===id);
            if(!r) return;
            document.getElementById('editId').value=r.id;
            document.getElementById('editName').value=r.name;
            document.getElementById('editAmount').value=r.amount;
            document.getElementById('editDirection').value=r.direction;
            document.getElementById('editDesc').value=r.description||'';
            document.getElementById('editDate').value=r.date||'';
            document.getElementById('editStatus').value=r.status;
            document.getElementById('editModal').style.display='flex';
        }
        function closeEditModal() { document.getElementById('editModal').style.display='none'; }
        async function saveEdit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const up = {
                name: document.getElementById('editName').value.trim(),
                amount: parseFloat(document.getElementById('editAmount').value),
                direction: document.getElementById('editDirection').value,
                description: document.getElementById('editDesc').value.trim(),
                date: document.getElementById('editDate').value || getTodayDate(),
                status: document.getElementById('editStatus').value
            };
            if(!up.name || isNaN(up.amount) || up.amount<=0) return showToast('信息不完整','error');
            await updateRecord(id, up);
            showToast('已更新','success');
            closeEditModal();
        }

        async function manualAddRecord(e) {
            e.preventDefault();
            const rec = {
                id: generateId(),
                name: document.getElementById('manualName').value.trim(),
                amount: parseFloat(document.getElementById('manualAmount').value),
                direction: document.getElementById('manualDirection').value,
                description: document.getElementById('manualDesc').value.trim(),
                date: document.getElementById('manualDate').value || getTodayDate(),
                status: 'approved',
                createdAt: new Date().toISOString()
            };
            if(!rec.name || isNaN(rec.amount) || rec.amount<=0 || !rec.direction) return showToast('请填写完整','error');
            await addRecord(rec);
            document.getElementById('manualAddForm').reset();
            document.getElementById('manualDate').value = getTodayDate();
            showToast('添加成功','success');
        }

        function changePassword(e) {
            e.preventDefault();
            const pwd = document.getElementById('newPassword').value.trim();
            if(pwd.length<4) return showToast('密码至少4位','error');
            localStorage.setItem('adminPassword', pwd);
            document.getElementById('newPassword').value='';
            showToast('密码已更新','success');
        }
        function updateStats() {
            const t=cachedRecords.length, a=cachedRecords.filter(r=>r.status==='approved').length, p=cachedRecords.filter(r=>r.status==='pending').length, rj=cachedRecords.filter(r=>r.status==='rejected').length;
            document.getElementById('statsInfo').textContent = `共 ${t} 条 | 已批准 ${a} | 待审核 ${p} | 已拒绝 ${rj}`;
        }
        async function resetAllData() {
            if(!confirm('确定清空所有数据？')) return;
            cachedRecords = [];
            if(await saveAllRecords()) showToast('已清空','info');
        }

        // 初始化
        function init() {
            document.getElementById('applyDate').value = getTodayDate();
            document.getElementById('manualDate').value = getTodayDate();
            startPolling();
            document.getElementById('editModal').addEventListener('click', function(e){ if(e.target===this) closeEditModal(); });
            document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeEditModal(); });
        }

        window.switchView = switchView;
        window.switchAdminPanel = switchAdminPanel;
        window.performQuery = performQuery;
        window.submitApplication = submitApplication;
        window.adminLogin = adminLogin;
        window.adminLogout = adminLogout;
        window.editRecord = editRecord;
        window.closeEditModal = closeEditModal;
        window.saveEdit = saveEdit;
        window.deleteRecord = deleteRecord;
        window.approveRecord = approveRecord;
        window.rejectRecord = rejectRecord;
        window.manualAddRecord = manualAddRecord;
        window.changePassword = changePassword;
        window.resetAllData = resetAllData;
        window.renderAllRecords = renderAllRecords;
        window.renderPendingRecords = renderPendingRecords;
        window.updateStats = updateStats;

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
