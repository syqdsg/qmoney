<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>QUEDE studio债务查询系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      padding: 2rem 2rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 2rem;
      color: #1e293b;
      margin-bottom: 0.2rem;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #475569;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
    }
    .tabs {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 0.7rem 1.5rem;
      border-radius: 3rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
    }
    .tab-btn.active {
      background: #1e293b;
      color: white;
      border-color: #1e293b;
      box-shadow: 0 10px 15px -5px rgba(0, 0, 0, 0.2);
    }
    .panel {
      display: none;
      animation: fade 0.25s ease;
    }
    .panel.active {
      display: block;
    }
    @keyframes fade {
      from { opacity: 0.3; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1.8rem;
      padding: 1.8rem;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.7);
      margin-bottom: 1.8rem;
    }
    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }
    input,
    select,
    textarea {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 0.75rem 1.2rem;
      border-radius: 1.5rem;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
      background: #ffffff;
      font-family: inherit;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    textarea {
      border-radius: 1rem;
      resize: vertical;
      min-height: 60px;
      flex: 2;
      min-width: 200px;
    }
    .btn {
      background: #1e293b;
      color: white;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 2.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      background: #0f172a;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }
    .btn:hover {
      background: #1e293b;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #1e293b;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }
    .btn-small {
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      border-radius: 2rem;
    }
    .btn-danger {
      background: #dc2626;
      border-color: #dc2626;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .result-box {
      margin-top: 1.5rem;
      background: #f8fafc;
      border-radius: 1.2rem;
      padding: 1.2rem;
      background: rgba(255, 255, 255, 0.5);
      max-height: 500px;
      overflow-y: auto;
    }
    .debt-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0.9rem 0.8rem;
      border-bottom: 1px dashed #cbd5e1;
      flex-wrap: wrap;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 0.8rem;
      margin-bottom: 0.4rem;
    }
    .debt-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    .debt-info {
      flex: 1;
      min-width: 200px;
    }
    .debt-name {
      font-weight: 700;
      font-size: 1rem;
    }
    .debt-meta {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.2rem;
    }
    .debt-note {
      font-size: 0.8rem;
      color: #475569;
      background: #f1f5f9;
      padding: 0.3rem 0.7rem;
      border-radius: 0.6rem;
      margin-top: 0.3rem;
      font-style: italic;
    }
    .badge {
      background: #dbeafe;
      color: #1e40af;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .badge-red {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge-green {
      background: #dcfce7;
      color: #166534;
    }
    .badge-overdue {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .status-tag {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 1rem;
      font-size: 0.7rem;
      font-weight: 700;
      margin-left: 0.5rem;
    }
    .status-overdue {
      background: #fee2e2;
      color: #dc2626;
    }
    .status-upcoming {
      background: #fef3c7;
      color: #92400e;
    }
    .status-ok {
      background: #dcfce7;
      color: #166534;
    }
    .status-nodate {
      background: #f1f5f9;
      color: #64748b;
    }
    .password-area {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    hr {
      margin: 1.5rem 0 1rem;
      border: 0.5px solid #e2e8f0;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }
    .flex-col {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .mt-2 {
      margin-top: 1rem;
    }
    .text-muted {
      color: #475569;
      font-size: 0.9rem;
    }
    .note-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #92400e;
    }
    .action-btns {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .date-input {
      flex: 1;
      min-width: 150px;
    }
    .summary-card {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      color: white;
      padding: 1.2rem 1.5rem;
      border-radius: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: space-around;
    }
    .summary-item {
      text-align: center;
      min-width: 100px;
    }
    .summary-value {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -1px;
    }
    .summary-label {
      font-size: 0.75rem;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    @media (max-width: 640px) {
      .container { padding: 1.2rem; }
      .btn { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
      input, select { padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💸 债务簿</h1>
    <div class="subtitle">QUEDE studio个人借贷管理</div>

    <div class="tabs">
      <button class="tab-btn active" id="tabQueryBtn">🔍 查询债务</button>
      <button class="tab-btn" id="tabRequestBtn">📩 申请欠款</button>
      <button class="tab-btn" id="tabAdminBtn">🔐 后台管理</button>
    </div>

    <!-- 查询面板 -->
    <div class="panel active" id="queryPanel">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">按姓名查询</h3>
        <div class="input-group">
          <input type="text" id="searchNameInput" placeholder="输入姓名，例如：张三" autocomplete="off">
          <button class="btn" id="searchBtn">🔎 查询</button>
        </div>
        <div id="queryResult" class="result-box" style="display: none;"></div>
      </div>
      <p class="text-muted">* 公开查询：数据来源于云端,所有人看到同一份债务记录。</p>
    </div>

    <!-- 申请面板 -->
    <div class="panel" id="requestPanel">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">✋ 发起欠款申请</h3>
        <p class="text-muted" style="margin-bottom: 1rem;">提交后需等待管理员审核通过才会生效。</p>
        <div class="flex-col">
          <div class="input-group">
            <input type="text" id="reqName" placeholder="申请人姓名" autocomplete="off" style="flex:1;">
            <input type="number" id="reqAmount" placeholder="金额 (元)" step="0.01" min="0.01" style="flex:1;">
            <select id="reqDirection" style="flex:0.8;">
              <option value="theyOwe">我欠管理员</option>
              <option value="iOwe">管理员欠我</option>
            </select>
          </div>
          <div class="input-group">
            <input type="date" id="reqDueDate" class="date-input" style="flex:1;">
            <input type="text" id="reqNote" placeholder="备注（选填）" style="flex:2;">
          </div>
          <button class="btn" id="submitRequestBtn" style="align-self: flex-start;">📤 提交申请</button>
        </div>
        <div id="requestMessage" class="text-muted mt-2"></div>
        <div class="note-box">
          💡 提交后需等待管理员审核。审核通过后才能在查询中看到。
        </div>
      </div>
    </div>

    <!-- 后台管理面板 -->
    <div class="panel" id="adminPanel">
      <div class="card">
        <div class="password-area">
          <input type="password" id="adminPasswordInput" placeholder="请输入后台管理密码" style="flex:2;">
          <button class="btn" id="loginAdminBtn">🔓 登录后台</button>
          <span id="adminStatus" class="text-muted"></span>
        </div>
        <div class="note-box" style="margin-bottom:1rem;">
          🔐 输入管理密码即可登录后台。
        </div>
        <div id="adminContent" style="display: none;">
          <hr>
          <h4 style="margin-bottom: 0.8rem;">➕ 手动添加债务记录（直接生效）</h4>
          <div class="flex-col">
            <div class="flex-row">
              <input type="text" id="adminName" placeholder="姓名" style="flex:1;">
              <input type="number" id="adminAmount" placeholder="金额" step="0.01" style="flex:1;">
              <select id="adminDirection" style="flex:0.8;">
                <option value="theyOwe">我欠管理员</option>
                <option value="iOwe">管理员欠我</option>
              </select>
            </div>
            <div class="flex-row">
              <input type="date" id="adminDueDate" class="date-input" style="flex:1;">
              <input type="text" id="adminNote" placeholder="备注（选填）" style="flex:2;">
            </div>
            <button class="btn" id="addDebtBtn" style="align-self: flex-start;">✅ 直接添加</button>
          </div>
          <hr>
          <h4 style="margin-bottom: 0.8rem;">📋 待审核申请</h4>
          <div id="pendingRequestsList" class="result-box" style="background: #fff9f0;">
            <p>暂无待审核申请</p>
          </div>
          <hr>
          <h4>📊 所有已审核债务记录</h4>
          <div id="allDebtsList" class="result-box">
            <p>暂无已审核债务</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ==================== 配置 ====================
      const GITHUB_USERNAME = 'syqdsg';
      const REPO_NAME = 'debt-manager';
      const DATA_FILE_PATH = 'data.json';
      
      // ★★★ 管理密码 ★★★
      const ADMIN_PASSWORD = 'syqdsg';

      // 改成这行（用 api.github.com 接口，支持跨域）
      const API_CONTENTS = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${DATA_FILE_PATH}`;
      // 触发 Actions 的地址（写入需要 Token，但通过 Actions 的 Secrets 来保护）
      const DISPATCH_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/actions/workflows/update-debt.yml/dispatches`;

      // ★★★ GitHub Token（仅用于触发 Actions，且通过 Secrets 保护） ★★★
      // 注意：这个 Token 需要有 workflow 权限
      let githubToken = '';
      
      let adminLoggedIn = false;
      let cachedDebts = [];

      // ==================== 工具函数 ====================
      function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
      }

      // ==================== 日期判断 ====================
      function isOverdue(dueDateStr) {
        if (!dueDateStr) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dueDateStr + 'T00:00:00');
        return due < today;
      }

      function isUpcoming(dueDateStr, days = 7) {
        if (!dueDateStr) return false;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dueDateStr + 'T00:00:00');
        const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
        return diffDays >= 0 && diffDays <= days;
      }

      function getDueStatusLabel(dueDateStr) {
        if (!dueDateStr) return '<span class="status-tag status-nodate">📅 未设日期</span>';
        if (isOverdue(dueDateStr)) return '<span class="status-tag status-overdue">⚠ 已逾期</span>';
        if (isUpcoming(dueDateStr)) return '<span class="status-tag status-upcoming">⏰ 即将到期</span>';
        return '<span class="status-tag status-ok">✅ 正常</span>';
      }

      function formatDate(dateStr) {
        return dateStr || '未设置';
      }

      // ==================== 数据读写（通过 Actions） ====================
      // 读取：直接从 raw.githubusercontent.com 读（公开，不需要 Token）
      // 读取：通过 api.github.com/contents 接口（支持跨域，公开仓库不需要 Token）
async function fetchDataFile() {
    const response = await fetch(API_CONTENTS, {
        headers: {
            'Accept': 'application/vnd.github.v3+json'
        }
    });
    if (!response.ok) {
        if (response.status === 404) return { debts: [] };
        throw new Error(`读取失败: ${response.status}`);
    }
    const data = await response.json();
    // GitHub API 返回的 content 是 Base64 编码的
    const content = JSON.parse(atob(data.content));
    return { debts: content.debts || [] };
}

      // 写入：触发 GitHub Actions
      async function triggerWorkflow(action, debtData, extraParams = {}) {
        const body = {
          ref: 'main',
          inputs: {
            action: action,
            debt_data: typeof debtData === 'string' ? debtData : JSON.stringify(debtData)
          }
        };
        
        if (extraParams.debt_id) {
          body.inputs.debt_id = extraParams.debt_id;
        }

        const response = await fetch(DISPATCH_URL, {
          method: 'POST',
          headers: {
            'Accept': 'application/vnd.github.v3+json',
            'Authorization': `token ${githubToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          throw new Error(`提交失败 (${response.status})`);
        }

        // 等待 Actions 执行完成
        await new Promise(resolve => setTimeout(resolve, 5000));
        // 重新加载数据
        await refreshData();
      }

      async function refreshData() {
        try {
          const data = await fetchDataFile();
          cachedDebts = data.debts || [];
          return cachedDebts;
        } catch (e) {
          console.error('刷新数据失败:', e);
          return cachedDebts;
        }
      }

      // ==================== UI 切换 ====================
      const tabQuery = document.getElementById('tabQueryBtn');
      const tabRequest = document.getElementById('tabRequestBtn');
      const tabAdmin = document.getElementById('tabAdminBtn');
      const panels = {
        query: document.getElementById('queryPanel'),
        request: document.getElementById('requestPanel'),
        admin: document.getElementById('adminPanel'),
      };

      function switchTab(tabName) {
        Object.keys(panels).forEach(key => panels[key].classList.remove('active'));
        panels[tabName].classList.add('active');
        tabQuery.classList.remove('active');
        tabRequest.classList.remove('active');
        tabAdmin.classList.remove('active');
        if (tabName === 'query') tabQuery.classList.add('active');
        if (tabName === 'request') tabRequest.classList.add('active');
        if (tabName === 'admin') tabAdmin.classList.add('active');

        if (tabName === 'admin' && adminLoggedIn) refreshAdminPanel();
        if (tabName === 'query') {
          document.getElementById('queryResult').style.display = 'none';
          refreshData();
        }
      }

      tabQuery.addEventListener('click', () => switchTab('query'));
      tabRequest.addEventListener('click', () => switchTab('request'));
      tabAdmin.addEventListener('click', () => switchTab('admin'));

      // ==================== 查询面板 ====================
      document.getElementById('searchBtn').addEventListener('click', performQuery);
      document.getElementById('searchNameInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performQuery();
      });

      async function performQuery() {
        const name = document.getElementById('searchNameInput').value.trim();
        const resultDiv = document.getElementById('queryResult');
        if (!name) {
          resultDiv.style.display = 'block';
          resultDiv.innerHTML = '<p style="color:#b91c1c;">请输入姓名</p>';
          return;
        }

        const debts = await refreshData();
        const filtered = debts.filter(d => d.name === name && d.status === 'approved');
        const theyOweTotal = filtered.filter(d => d.type === 'theyOwe').reduce((s, d) => s + d.amount, 0);
        const iOweTotal = filtered.filter(d => d.type === 'iOwe').reduce((s, d) => s + d.amount, 0);
        const overdueTotal = filtered
          .filter(d => isOverdue(d.dueDate))
          .reduce((s, d) => s + d.amount, 0);

        resultDiv.style.display = 'block';
        if (filtered.length === 0) {
          resultDiv.innerHTML = `<p>未找到与 <strong>${escapeHtml(name)}</strong> 相关的已审核债务记录。</p>`;
          return;
        }

        let html = `<p style="font-weight:600; margin-bottom:1rem;">📌 ${escapeHtml(name)} 的债务概况</p>`;
        html += `<div class="summary-card">
          <div class="summary-item"><div class="summary-value">¥${theyOweTotal.toFixed(2)}</div><div class="summary-label">我欠管理员</div></div>
          <div class="summary-item"><div class="summary-value">¥${iOweTotal.toFixed(2)}</div><div class="summary-label">管理员欠我</div></div>
          ${overdueTotal > 0 ? `<div class="summary-item"><div class="summary-value" style="color:#fca5a5;">¥${overdueTotal.toFixed(2)}</div><div class="summary-label">已逾期 ⚠</div></div>` : ''}
        </div>`;
        html += `<div style="font-size:0.9rem; color:#334155; margin-bottom:0.5rem;">详细记录：</div>`;

        const sorted = [...filtered].sort((a, b) => (isOverdue(a.dueDate) ? 0 : 1) - (isOverdue(b.dueDate) ? 0 : 1));

        sorted.forEach(d => {
          const typeLabel = d.type === 'theyOwe' ? '💰 我欠管理员' : '🧾 管理员欠我';
          const dueStatus = getDueStatusLabel(d.dueDate);
          const overdueClass = isOverdue(d.dueDate) ? 'badge-overdue' : '';
          const noteHtml = d.note ? `<div class="debt-note">📝 ${escapeHtml(d.note)}</div>` : '';
          html += `<div class="debt-item ${overdueClass}">
            <div class="debt-info">
              <div class="debt-name">${typeLabel} - ¥${d.amount.toFixed(2)} ${dueStatus}</div>
              <div class="debt-meta">📅 还款日期: ${formatDate(d.dueDate)}</div>
              ${noteHtml}
            </div>
          </div>`;
        });
        resultDiv.innerHTML = html;
      }

      // ==================== 申请面板 ====================
      document.getElementById('submitRequestBtn').addEventListener('click', async () => {
        const name = document.getElementById('reqName').value.trim();
        const amountStr = document.getElementById('reqAmount').value;
        const direction = document.getElementById('reqDirection').value;
        const dueDate = document.getElementById('reqDueDate').value;
        const note = document.getElementById('reqNote').value.trim();
        const msgDiv = document.getElementById('requestMessage');

        if (!name) { msgDiv.innerHTML = '<span style="color:#b91c1c;">请输入姓名</span>'; return; }
        const amount = parseFloat(amountStr);
        if (isNaN(amount) || amount <= 0) { msgDiv.innerHTML = '<span style="color:#b91c1c;">请输入有效金额</span>'; return; }

        if (!githubToken) {
          msgDiv.innerHTML = '<span style="color:#b91c1c;">❌ 系统未配置写入功能，请联系管理员。</span>';
          return;
        }

        msgDiv.innerHTML = '<span style="color:#0f5132;">⏳ 正在提交申请...</span>';

        try {
          const newDebt = {
            id: generateId(),
            name: name,
            type: direction,
            amount: amount,
            dueDate: dueDate || null,
            note: note || '',
            status: 'pending'
          };

          await triggerWorkflow('add', newDebt);

          document.getElementById('reqName').value = '';
          document.getElementById('reqAmount').value = '';
          document.getElementById('reqDueDate').value = '';
          document.getElementById('reqNote').value = '';
          msgDiv.innerHTML = '<span style="color:#0f5132;">✅ 申请已提交，等待管理员审核。</span>';
          if (adminLoggedIn) refreshAdminPanel();
        } catch (e) {
          msgDiv.innerHTML = `<span style="color:#b91c1c;">❌ 提交失败: ${escapeHtml(e.message)}</span>`;
        }
      });

      // ==================== 后台管理 ====================
      const adminContent = document.getElementById('adminContent');
      const adminStatus = document.getElementById('adminStatus');
      const passwordInput = document.getElementById('adminPasswordInput');

      document.getElementById('loginAdminBtn').addEventListener('click', async () => {
        const pwd = passwordInput.value.trim();
        if (pwd === ADMIN_PASSWORD) {
          adminLoggedIn = true;
          adminContent.style.display = 'block';
          adminStatus.innerHTML = '✅ 已登录';
          adminStatus.style.color = '#0f5132';
          
          // 同时需要配置 Token 才能进行写入操作
          if (!githubToken) {
            const tokenInput = prompt('请输入 GitHub Token（用于写入操作）：');
            if (tokenInput) {
              githubToken = tokenInput.trim();
              sessionStorage.setItem('gh_token', githubToken);
            }
          }
          
          passwordInput.value = '';
          refreshAdminPanel();
        } else {
          adminLoggedIn = false;
          adminContent.style.display = 'none';
          adminStatus.innerHTML = '❌ 密码错误';
          adminStatus.style.color = '#b91c1c';
        }
      });

      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('loginAdminBtn').click();
      });

      // 手动添加债务
      document.getElementById('addDebtBtn').addEventListener('click', async () => {
        if (!adminLoggedIn) { alert('请先登录后台'); return; }
        if (!githubToken) { alert('请先配置 Token（重新登录后台并输入 Token）'); return; }
        
        const name = document.getElementById('adminName').value.trim();
        const amountStr = document.getElementById('adminAmount').value;
        const direction = document.getElementById('adminDirection').value;
        const dueDate = document.getElementById('adminDueDate').value;
        const note = document.getElementById('adminNote').value.trim();

        if (!name || isNaN(parseFloat(amountStr)) || parseFloat(amountStr) <= 0) {
          alert('请填写完整有效信息（姓名和金额必填）');
          return;
        }
        try {
          const newDebt = {
            id: generateId(),
            name: name,
            type: direction,
            amount: parseFloat(amountStr),
            dueDate: dueDate || null,
            note: note || '',
            status: 'approved'
          };

          await triggerWorkflow('add', newDebt);

          document.getElementById('adminName').value = '';
          document.getElementById('adminAmount').value = '';
          document.getElementById('adminDueDate').value = '';
          document.getElementById('adminNote').value = '';
          refreshAdminPanel();
        } catch (e) {
          alert('添加失败: ' + e.message);
        }
      });

      async function editDebt(id) {
        if (!adminLoggedIn || !githubToken) return;
        const debts = await refreshData();
        const debt = debts.find(d => d.id === id);
        if (!debt) return;
        const newDueDate = prompt('修改还款日期 (YYYY-MM-DD，取消不修改)：', debt.dueDate || '');
        if (newDueDate === null) return;
        const newNote = prompt('修改备注（取消不修改）：', debt.note || '');
        if (newNote === null) return;
        debt.dueDate = newDueDate.trim() || null;
        debt.note = newNote.trim();
        try {
          await triggerWorkflow('update_all', { debts: debts });
          refreshAdminPanel();
        } catch (e) {
          alert('修改失败: ' + e.message);
        }
      }

      async function approveRequest(id) {
        if (!adminLoggedIn || !githubToken) return;
        try {
          await triggerWorkflow('approve', {}, { debt_id: id });
          refreshAdminPanel();
        } catch (e) {
          alert('操作失败: ' + e.message);
        }
      }

      async function rejectRequest(id) {
        if (!adminLoggedIn || !githubToken) return;
        try {
          await triggerWorkflow('delete', {}, { debt_id: id });
          refreshAdminPanel();
        } catch (e) {
          alert('操作失败: ' + e.message);
        }
      }

      async function deleteDebt(id) {
        if (!adminLoggedIn || !githubToken) return;
        if (!confirm('确定删除这条记录吗？')) return;
        try {
          await triggerWorkflow('delete', {}, { debt_id: id });
          refreshAdminPanel();
        } catch (e) {
          alert('删除失败: ' + e.message);
        }
      }

      async function refreshAdminPanel() {
        if (!adminLoggedIn) return;
        const debts = await refreshData();
        const pending = debts.filter(d => d.status === 'pending');
        const approved = debts.filter(d => d.status === 'approved');
        const overdueCount = approved.filter(d => isOverdue(d.dueDate)).length;

        const pendingDiv = document.getElementById('pendingRequestsList');
        if (pending.length === 0) {
          pendingDiv.innerHTML = '<p>✨ 暂无待审核申请</p>';
        } else {
          let html = '';
          pending.forEach(p => {
            const typeText = p.type === 'theyOwe' ? '我欠管理员' : '管理员欠我';
            const dueDateText = p.dueDate ? `📅 ${p.dueDate}` : '📅 未设日期';
            const noteText = p.note ? `<br>📝 ${escapeHtml(p.note)}` : '';
            html += `<div class="debt-item">
              <div class="debt-info">
                <div class="debt-name">${escapeHtml(p.name)} - ${typeText} ¥${p.amount.toFixed(2)}</div>
                <div class="debt-meta">${dueDateText}${noteText}</div>
              </div>
              <div class="action-btns">
                <button class="btn btn-small" onclick="window.approveReq('${p.id}')">✅通过</button>
                <button class="btn btn-outline btn-small" onclick="window.rejectReq('${p.id}')">❌拒绝</button>
              </div>
            </div>`;
          });
          pendingDiv.innerHTML = html;
        }

        const allDiv = document.getElementById('allDebtsList');
        if (approved.length === 0) {
          allDiv.innerHTML = '<p>暂无已审核债务</p>';
        } else {
          let html = `<p style="margin-bottom:0.8rem;">共 ${approved.length} 条记录 | 
            <span style="color:#dc2626;font-weight:700;">⚠ 逾期: ${overdueCount} 条</span></p>`;
          const sorted = [...approved].sort((a, b) => (isOverdue(a.dueDate) ? 0 : 1) - (isOverdue(b.dueDate) ? 0 : 1));
          sorted.forEach(d => {
            const typeText = d.type === 'theyOwe' ? '💰我欠管理员' : '🧾管理员欠我';
            const dueStatus = getDueStatusLabel(d.dueDate);
            const overdueClass = isOverdue(d.dueDate) ? 'badge-overdue' : '';
            const noteHtml = d.note ? `<div class="debt-note">📝 ${escapeHtml(d.note)}</div>` : '';
            html += `<div class="debt-item ${overdueClass}">
              <div class="debt-info">
                <div class="debt-name">${escapeHtml(d.name)} - ${typeText} ¥${d.amount.toFixed(2)} ${dueStatus}</div>
                <div class="debt-meta">📅 还款日期: ${formatDate(d.dueDate)}</div>
                ${noteHtml}
              </div>
              <div class="action-btns">
                <button class="btn btn-outline btn-small" onclick="window.editDebtById('${d.id}')">✏️编辑</button>
                <button class="btn btn-danger btn-small" onclick="window.deleteDebtById('${d.id}')">🗑️</button>
              </div>
            </div>`;
          });
          allDiv.innerHTML = html;
        }
      }

      window.approveReq = (id) => approveRequest(id);
      window.rejectReq = (id) => rejectRequest(id);
      window.deleteDebtById = (id) => deleteDebt(id);
      window.editDebtById = (id) => editDebt(id);

      // ==================== 初始化 ====================
      async function init() {
        // 从 session 恢复 Token
        const savedToken = sessionStorage.getItem('gh_token');
        if (savedToken) {
          githubToken = savedToken;
        }

        try {
          await refreshData();
        } catch (e) {
          console.log('初始数据加载:', e.message);
        }
        switchTab('query');
      }

      init();
    })();
  </script>
</body>
</html>
