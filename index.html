<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>债务查询系统 | 个人借贷管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 950px;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      padding: 2rem 2rem 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    h1 {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 2rem;
      color: #1e293b;
      margin-bottom: 0.2rem;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: #475569;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
    }
    .tabs {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8);
      padding: 0.7rem 1.8rem;
      border-radius: 3rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
    }
    .tab-btn.active {
      background: #1e293b;
      color: white;
      border-color: #1e293b;
      box-shadow: 0 10px 15px -5px rgba(0, 0, 0, 0.2);
    }
    .panel {
      display: none;
      animation: fade 0.25s ease;
    }
    .panel.active {
      display: block;
    }
    @keyframes fade {
      from { opacity: 0.3; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 1.8rem;
      padding: 1.8rem;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.7);
      margin-bottom: 1.8rem;
    }
    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }
    input,
    select {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 0.8rem 1.2rem;
      border-radius: 2.5rem;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
      flex: 2;
      min-width: 180px;
      background: #ffffff;
    }
    input:focus,
    select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    .btn {
      background: #1e293b;
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 2.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      background: #0f172a;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn:hover {
      background: #1e293b;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #1e293b;
      box-shadow: none;
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }
    .btn-small {
      padding: 0.3rem 1rem;
      font-size: 0.8rem;
      border-radius: 2rem;
    }
    .result-box {
      margin-top: 1.5rem;
      background: #f8fafc;
      border-radius: 1.2rem;
      padding: 1.2rem;
      background: rgba(255, 255, 255, 0.5);
      max-height: 400px;
      overflow-y: auto;
    }
    .debt-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 0;
      border-bottom: 1px dashed #cbd5e1;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .badge {
      background: #dbeafe;
      color: #1e40af;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.8rem;
      white-space: nowrap;
    }
    .badge-red {
      background: #fee2e2;
      color: #991b1b;
    }
    .password-area {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    hr {
      margin: 1.5rem 0 1rem;
      border: 0.5px solid #e2e8f0;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }
    .mt-2 {
      margin-top: 1rem;
    }
    .text-muted {
      color: #475569;
      font-size: 0.9rem;
    }
    .note-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 1rem;
      padding: 0.8rem 1rem;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💸 债务簿</h1>
    <div class="subtitle">个人借贷管理</div>

    <div class="tabs">
      <button class="tab-btn active" id="tabQueryBtn">🔍 查询债务</button>
      <button class="tab-btn" id="tabRequestBtn">📩 申请欠款</button>
      <button class="tab-btn" id="tabAdminBtn">🔐 后台管理</button>
    </div>

    <!-- 查询面板 -->
    <div class="panel active" id="queryPanel">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">按姓名查询</h3>
        <div class="input-group">
          <input type="text" id="searchNameInput" placeholder="输入姓名，例如：张三" autocomplete="off">
          <button class="btn" id="searchBtn">🔎 查询</button>
        </div>
        <div id="queryResult" class="result-box" style="display: none;"></div>
      </div>
    </div>

    <!-- 申请面板 -->
    <div class="panel" id="requestPanel">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">✋ 发起欠款申请</h3>
        <p class="text-muted" style="margin-bottom: 1rem;">提交后需等待管理员审核通过才会生效。</p>
        <div class="input-group">
          <input type="text" id="reqName" placeholder="申请人姓名" autocomplete="off">
          <input type="number" id="reqAmount" placeholder="金额 (元)" step="0.01" min="0.01">
          <select id="reqDirection">
            <option value="theyOwe">对方欠我 (他们欠我)</option>
            <option value="iOwe">我欠他们 (我欠对方)</option>
          </select>
          <button class="btn" id="submitRequestBtn">📤 提交申请</button>
        </div>
        <div id="requestMessage" class="text-muted mt-2"></div>
        <div class="note-box">
          💡 提示：提交申请需要管理员已登录后台，否则无法写入云端。
        </div>
      </div>
    </div>

    <!-- 后台管理面板 -->
    <div class="panel" id="adminPanel">
      <div class="card">
        <div class="password-area">
          <input type="password" id="githubToken" placeholder="GitHub Personal Access Token" style="flex:2;">
          <button class="btn" id="loginAdminBtn">🔓 登录后台</button>
          <span id="adminStatus" class="text-muted"></span>
        </div>
        <div class="note-box" style="margin-bottom:1rem;">
          🔐 需要 GitHub Token。Token 只在当前浏览器会话中保存。
        </div>
        <div id="adminContent" style="display: none;">
          <hr>
          <h4 style="margin-bottom: 0.8rem;">➕ 手动添加债务记录（直接生效）</h4>
          <div class="flex-row">
            <input type="text" id="adminName" placeholder="姓名" style="flex:1;">
            <input type="number" id="adminAmount" placeholder="金额" step="0.01" style="flex:1;">
            <select id="adminDirection">
              <option value="theyOwe">对方欠我</option>
              <option value="iOwe">我欠对方</option>
            </select>
            <button class="btn" id="addDebtBtn">✅ 直接添加</button>
          </div>
          <hr>
          <h4 style="margin-bottom: 0.8rem;">📋 待审核申请</h4>
          <div id="pendingRequestsList" class="result-box" style="background: #fff9f0;">
            <p>暂无待审核申请</p>
          </div>
          <hr>
          <h4>📊 所有已审核债务记录</h4>
          <div id="allDebtsList" class="result-box">
            <p>暂无已审核债务</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ==================== 配置（改成你自己的） ====================
      const GITHUB_USERNAME = 'syqdsg';   // ← 改成你的
      const REPO_NAME = 'debt-manager';             // ← 改成你的仓库名
      const DATA_FILE_PATH = 'data.json';

      const API_BASE = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${DATA_FILE_PATH}`;

      // ==================== 状态 ====================
      let githubToken = sessionStorage.getItem('gh_token') || '';
      let cachedDebts = [];

      // ==================== 工具函数 ====================
      function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
      }

      // ==================== 关键修复：正确处理中文 Base64 ====================
      // 把字符串转成 Base64（支持中文）
      function toBase64(str) {
        // 使用 TextEncoder 将字符串转为 UTF-8 字节，再转 Base64
        const encoder = new TextEncoder();
        const bytes = encoder.encode(str);
        let binary = '';
        bytes.forEach(b => binary += String.fromCharCode(b));
        return btoa(binary);
      }

      // 把 Base64 解码成字符串（支持中文）
      function fromBase64(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const decoder = new TextDecoder('utf-8');
        return decoder.decode(bytes);
      }

      // ==================== GitHub API 操作 ====================
      async function fetchDataFile() {
        const headers = {};
        if (githubToken) {
          headers['Authorization'] = `token ${githubToken}`;
        }
        const response = await fetch(API_BASE, { headers });
        if (!response.ok) {
          if (response.status === 404) {
            return { debts: [], sha: null };
          }
          throw new Error(`读取失败: ${response.status}`);
        }
        const data = await response.json();
        // 用修复后的解码函数
        const content = JSON.parse(fromBase64(data.content));
        return { debts: content.debts || [], sha: data.sha };
      }

      async function saveDataFile(debts) {
        if (!githubToken) {
          throw new Error('未登录后台，无法写入');
        }
        const { sha: latestSha } = await fetchDataFile();
        const jsonStr = JSON.stringify({ debts }, null, 2);
        const body = {
          message: '更新债务数据',
          content: toBase64(jsonStr),  // 用修复后的编码函数
        };
        if (latestSha) {
          body.sha = latestSha;
        }
        const response = await fetch(API_BASE, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(body),
        });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.message || '保存失败');
        }
      }

      // ==================== 数据刷新 ====================
      async function refreshData() {
        try {
          const { debts } = await fetchDataFile();
          cachedDebts = debts;
          return debts;
        } catch (e) {
          console.error('刷新数据失败:', e);
          return cachedDebts;
        }
      }

      // ==================== UI 切换 ====================
      const tabQuery = document.getElementById('tabQueryBtn');
      const tabRequest = document.getElementById('tabRequestBtn');
      const tabAdmin = document.getElementById('tabAdminBtn');
      const panels = {
        query: document.getElementById('queryPanel'),
        request: document.getElementById('requestPanel'),
        admin: document.getElementById('adminPanel'),
      };

      function switchTab(tabName) {
        Object.keys(panels).forEach(key => panels[key].classList.remove('active'));
        panels[tabName].classList.add('active');
        tabQuery.classList.remove('active');
        tabRequest.classList.remove('active');
        tabAdmin.classList.remove('active');
        if (tabName === 'query') tabQuery.classList.add('active');
        if (tabName === 'request') tabRequest.classList.add('active');
        if (tabName === 'admin') tabAdmin.classList.add('active');

        if (tabName === 'admin') refreshAdminPanel();
        if (tabName === 'query') {
          document.getElementById('queryResult').style.display = 'none';
          refreshData();
        }
      }

      tabQuery.addEventListener('click', () => switchTab('query'));
      tabRequest.addEventListener('click', () => switchTab('request'));
      tabAdmin.addEventListener('click', () => switchTab('admin'));

      // ==================== 查询逻辑 ====================
      document.getElementById('searchBtn').addEventListener('click', performQuery);
      document.getElementById('searchNameInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') performQuery();
      });

      async function performQuery() {
        const name = document.getElementById('searchNameInput').value.trim();
        const resultDiv = document.getElementById('queryResult');
        if (!name) {
          resultDiv.style.display = 'block';
          resultDiv.innerHTML = '<p style="color:#b91c1c;">请输入姓名</p>';
          return;
        }

        const debts = await refreshData();
        const filtered = debts.filter(d => d.name === name && d.status === 'approved');
        const theyOweTotal = filtered.filter(d => d.type === 'theyOwe').reduce((s, d) => s + d.amount, 0);
        const iOweTotal = filtered.filter(d => d.type === 'iOwe').reduce((s, d) => s + d.amount, 0);

        resultDiv.style.display = 'block';
        if (filtered.length === 0) {
          resultDiv.innerHTML = `<p>未找到与 <strong>${escapeHtml(name)}</strong> 相关的已审核债务记录。</p>`;
          return;
        }

        let html = `<p style="font-weight:600; margin-bottom:0.8rem;">📌 ${escapeHtml(name)} 的债务概况</p>`;
        html += `<div class="debt-item"><span>💰 对方欠我</span> <span class="badge">¥ ${theyOweTotal.toFixed(2)}</span></div>`;
        html += `<div class="debt-item"><span>🧾 我欠对方</span> <span class="badge badge-red">¥ ${iOweTotal.toFixed(2)}</span></div>`;

        if (filtered.length > 0) {
          html += `<div style="margin-top:1rem; font-size:0.9rem; color:#334155;">详细记录：</div>`;
          filtered.forEach(d => {
            const typeLabel = d.type === 'theyOwe' ? '对方欠我' : '我欠对方';
            html += `<div class="debt-item"><span>• ${typeLabel}</span> <span>¥${d.amount.toFixed(2)}</span></div>`;
          });
        }
        resultDiv.innerHTML = html;
      }

      // ==================== 申请欠款 ====================
      document.getElementById('submitRequestBtn').addEventListener('click', async () => {
        const name = document.getElementById('reqName').value.trim();
        const amountStr = document.getElementById('reqAmount').value;
        const direction = document.getElementById('reqDirection').value;
        const msgDiv = document.getElementById('requestMessage');

        if (!name) { msgDiv.innerHTML = '<span style="color:#b91c1c;">请输入姓名</span>'; return; }
        const amount = parseFloat(amountStr);
        if (isNaN(amount) || amount <= 0) { msgDiv.innerHTML = '<span style="color:#b91c1c;">请输入有效金额</span>'; return; }

        if (!githubToken) {
          msgDiv.innerHTML = '<span style="color:#b91c1c;">❌ 管理员未登录后台，无法提交申请。请先让管理员登录。</span>';
          return;
        }

        try {
          const debts = await refreshData();
          debts.push({
            id: generateId(),
            name: name,
            type: direction,
            amount: amount,
            status: 'pending'
          });
          await saveDataFile(debts);
          cachedDebts = debts;
          document.getElementById('reqName').value = '';
          document.getElementById('reqAmount').value = '';
          msgDiv.innerHTML = '<span style="color:#0f5132;">✅ 申请已提交，等待管理员审核。</span>';
          if (document.getElementById('adminContent').style.display !== 'none') {
            refreshAdminPanel();
          }
        } catch (e) {
          msgDiv.innerHTML = `<span style="color:#b91c1c;">❌ 提交失败: ${escapeHtml(e.message)}</span>`;
        }
      });

      // ==================== 后台管理 ====================
      const adminContent = document.getElementById('adminContent');
      const adminStatus = document.getElementById('adminStatus');
      const tokenInput = document.getElementById('githubToken');

      if (githubToken) {
        tokenInput.value = githubToken;
        adminContent.style.display = 'block';
        adminStatus.innerHTML = '✅ 已登录（Token 已加载）';
        adminStatus.style.color = '#0f5132';
        refreshAdminPanel();
      }

      document.getElementById('loginAdminBtn').addEventListener('click', async () => {
        const token = tokenInput.value.trim();
        if (!token) {
          adminStatus.innerHTML = '❌ 请输入 Token';
          adminStatus.style.color = '#b91c1c';
          return;
        }
        try {
          const testResponse = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}`, {
            headers: { 'Authorization': `token ${token}` }
          });
          if (!testResponse.ok) {
            adminStatus.innerHTML = '❌ Token 无效或无权限';
            adminStatus.style.color = '#b91c1c';
            return;
          }
          githubToken = token;
          sessionStorage.setItem('gh_token', token);
          adminContent.style.display = 'block';
          adminStatus.innerHTML = '✅ 已登录';
          adminStatus.style.color = '#0f5132';
          await refreshAdminPanel();
        } catch (e) {
          adminStatus.innerHTML = '❌ 网络错误';
          adminStatus.style.color = '#b91c1c';
        }
      });

      tokenInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('loginAdminBtn').click();
      });

      document.getElementById('addDebtBtn').addEventListener('click', async () => {
        if (!githubToken) { alert('请先登录后台'); return; }
        const name = document.getElementById('adminName').value.trim();
        const amountStr = document.getElementById('adminAmount').value;
        const direction = document.getElementById('adminDirection').value;
        if (!name || isNaN(parseFloat(amountStr)) || parseFloat(amountStr) <= 0) {
          alert('请填写完整有效信息');
          return;
        }
        try {
          const debts = await refreshData();
          debts.push({
            id: generateId(),
            name: name,
            type: direction,
            amount: parseFloat(amountStr),
            status: 'approved'
          });
          await saveDataFile(debts);
          cachedDebts = debts;
          document.getElementById('adminName').value = '';
          document.getElementById('adminAmount').value = '';
          refreshAdminPanel();
        } catch (e) {
          alert('添加失败: ' + e.message);
        }
      });

      async function approveRequest(id) {
        if (!githubToken) return;
        try {
          const debts = await refreshData();
          const index = debts.findIndex(d => d.id === id);
          if (index !== -1 && debts[index].status === 'pending') {
            debts[index].status = 'approved';
            await saveDataFile(debts);
            cachedDebts = debts;
            refreshAdminPanel();
          }
        } catch (e) {
          alert('操作失败: ' + e.message);
        }
      }

      async function rejectRequest(id) {
        if (!githubToken) return;
        try {
          let debts = await refreshData();
          debts = debts.filter(d => d.id !== id);
          await saveDataFile(debts);
          cachedDebts = debts;
          refreshAdminPanel();
        } catch (e) {
          alert('操作失败: ' + e.message);
        }
      }

      async function deleteDebt(id) {
        if (!githubToken) return;
        if (!confirm('确定删除这条记录吗？')) return;
        try {
          let debts = await refreshData();
          debts = debts.filter(d => d.id !== id);
          await saveDataFile(debts);
          cachedDebts = debts;
          refreshAdminPanel();
        } catch (e) {
          alert('删除失败: ' + e.message);
        }
      }

      async function refreshAdminPanel() {
        if (!githubToken) return;
        const debts = await refreshData();
        const pending = debts.filter(d => d.status === 'pending');
        const approved = debts.filter(d => d.status === 'approved');

        const pendingDiv = document.getElementById('pendingRequestsList');
        if (pending.length === 0) {
          pendingDiv.innerHTML = '<p>✨ 暂无待审核申请</p>';
        } else {
          let html = '';
          pending.forEach(p => {
            const typeText = p.type === 'theyOwe' ? '对方欠我' : '我欠对方';
            html += `<div class="debt-item">
              <span><strong>${escapeHtml(p.name)}</strong> - ${typeText} ¥${p.amount.toFixed(2)}</span>
              <span style="display:flex; gap:0.4rem;">
                <button class="btn btn-small" onclick="window.approveReq('${p.id}')">✅通过</button>
                <button class="btn btn-outline btn-small" onclick="window.rejectReq('${p.id}')">❌拒绝</button>
              </span>
            </div>`;
          });
          pendingDiv.innerHTML = html;
        }

        const allDiv = document.getElementById('allDebtsList');
        if (approved.length === 0) {
          allDiv.innerHTML = '<p>暂无已审核债务</p>';
        } else {
          let html = '';
          approved.forEach(d => {
            const typeText = d.type === 'theyOwe' ? '对方欠我' : '我欠对方';
            html += `<div class="debt-item">
              <span>${escapeHtml(d.name)} - ${typeText} ¥${d.amount.toFixed(2)}</span>
              <button class="btn btn-outline btn-small" onclick="window.deleteDebtById('${d.id}')">🗑️</button>
            </div>`;
          });
          allDiv.innerHTML = html;
        }
      }

      window.approveReq = (id) => approveRequest(id);
      window.rejectReq = (id) => rejectRequest(id);
      window.deleteDebtById = (id) => deleteDebt(id);

      // ==================== 初始化 ====================
      async function init() {
        try {
          await refreshData();
        } catch (e) {
          console.log('初始数据加载:', e.message);
        }
        switchTab('query');
      }

      init();
    })();
  </script>
</body>
</html>
